# Closed-tab: poke production keeper every 5 minutes (single pass, reliable).
#
# Secrets: APP_URL=https://rite-woad.vercel.app , CRON_SECRET
# Optional: VERCEL_AUTOMATION_BYPASS_SECRET
#
# Server also HTTP self-chains ~50s after each arm for denser coverage.

name: Agent keeper (unattended)

on:
  schedule:
    # GH schedules can drift; 5m is the practical free-tier cadence
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: agent-keeper
  # Never cancel — long ticks must finish; concurrent pokes are ok (server locks)
  cancel-in-progress: false

jobs:
  wake:
    name: Keeper poke
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check secrets
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Missing secret APP_URL (https://rite-woad.vercel.app)"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing secret CRON_SECRET"
            exit 1
          fi

      - name: Poke production cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -u
          BASE="${APP_URL%/}"
          url="${BASE}/api/agent/cron?max=40"
          if [ -n "${BYPASS:-}" ]; then
            url="${url}&x-vercel-protection-bypass=${BYPASS}"
          fi

          code=$(curl -sS -o /tmp/cron.json -w "%{http_code}" \
            --max-time 110 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: rite-agent-keeper/5.0" \
            -d '{}' \
            "$url" || echo "000")

          echo "cron HTTP $code"
          cat /tmp/cron.json 2>/dev/null; echo

          if [ "$code" != "200" ]; then
            echo "::error::Keeper poke failed HTTP $code"
            # Also try arm-unattended so chain restarts even if cron auth drifted
            arm_code=$(curl -sS -o /tmp/arm.json -w "%{http_code}" \
              --max-time 30 \
              -X POST \
              -H "Content-Type: application/json" \
              -H "x-rite-chain: 1" \
              -d '{"force":true,"kick":false}' \
              "${BASE}/api/agent/arm-unattended" || echo "000")
            echo "arm-unattended HTTP $arm_code"
            cat /tmp/arm.json 2>/dev/null; echo
            exit 1
          fi

          python3 - <<'PY' || true
          import json
          d=json.load(open("/tmp/cron.json"))
          print("ticked=", d.get("ticked"), "scanned=", d.get("scanned"))
          oc=(d.get("oracast") or {})
          print("oracast notified=", oc.get("notified"))
          for r in d.get("results") or []:
              if r.get("ok"):
                  print("OK", r.get("agentId"), r.get("telegram"), str(r.get("txHash") or "")[:16])
              elif r.get("error"):
                  print("ERR", r.get("agentId"), str(r.get("error"))[:100])
              elif r.get("skipped") in ("not_active","insufficient_balance","tick_in_flight_or_cooldown"):
                  print("NEED", r.get("agentId"), r.get("skipped"))
          PY
