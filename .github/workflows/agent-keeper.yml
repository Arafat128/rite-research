# Closed-tab pokes: Radar auto-wake + Oracast price DMs + official agents.
#
# Simple design: one short job every ~5 minutes (no long sleep loops).
# Long loops left dead zones when GitHub delayed/cancelled the next run —
# that skipped Oracast 15m Telegram windows after the first DM.
#
# Secrets: APP_URL (https://rite-woad.vercel.app), CRON_SECRET
# Optional: VERCEL_AUTOMATION_BYPASS_SECRET
# Best reliability: Upstash QStash 1m (scripts/setup-qstash-cron.mjs)

name: Agent keeper (unattended)

on:
  schedule:
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"
  workflow_dispatch:

concurrency:
  group: agent-keeper
  cancel-in-progress: false

jobs:
  poke:
    name: Single poke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Missing secret APP_URL (use https://rite-woad.vercel.app)"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing secret CRON_SECRET"
            exit 1
          fi
          echo "APP_URL=${APP_URL}"

      - name: Poke cron + oracast + official
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -u
          BASE="${APP_URL%/}"
          BP=""
          if [ -n "${BYPASS:-}" ]; then
            BP="x-vercel-protection-bypass=${BYPASS}"
          fi

          curl_auth() {
            # usage: curl_auth METHOD OUTFILE URL_PATH [extra curl args...]
            # URL_PATH like /api/oracast/tick  (leading slash)
            local method="$1" out="$2" path="$3"
            shift 3
            local url="${BASE}${path}"
            if [ -n "$BP" ]; then
              case "$url" in
                *\?*) url="${url}&${BP}" ;;
                *)    url="${url}?${BP}" ;;
              esac
            fi
            curl -sS -o "$out" -w "%{http_code}" \
              --max-time 90 \
              -X "$method" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              -H "User-Agent: rite-agent-keeper/2.0" \
              "$@" \
              "$url" || echo "000"
          }

          fail=0
          echo "=== $(date -u +%Y-%m-%dT%H:%M:%SZ) BASE=$BASE ==="

          code=$(curl_auth GET /tmp/health.json "/api/agent/cron?health=1")
          echo "health HTTP $code"
          cat /tmp/health.json 2>/dev/null; echo
          [ "$code" = "200" ] || fail=1

          code=$(curl_auth POST /tmp/cron.json "/api/agent/cron?max=40" -d '{}')
          echo "cron HTTP $code"
          cat /tmp/cron.json 2>/dev/null; echo
          [ "$code" = "200" ] || fail=1

          ocode=$(curl_auth POST /tmp/oracast.json "/api/oracast/tick" -d '{}')
          echo "oracast HTTP $ocode"
          cat /tmp/oracast.json 2>/dev/null; echo
          [ "$ocode" = "200" ] || fail=1

          ofcode=$(curl_auth POST /tmp/official.json "/api/official/tick" -d '{}')
          echo "official HTTP $ofcode"
          cat /tmp/official.json 2>/dev/null; echo

          if command -v python3 >/dev/null 2>&1; then
            python3 - <<'PY'
          import json
          try:
              d=json.load(open("/tmp/oracast.json"))
              print("oracast notified=", d.get("notified"), "scanned=", d.get("scanned"), "results=", d.get("results"))
          except Exception as e:
              print("oracast parse", e)
          try:
              d=json.load(open("/tmp/cron.json"))
              oc=d.get("oracast") or {}
              print("cron.oracast notified=", oc.get("notified"), "scanned=", oc.get("scanned"))
          except Exception as e:
              print("cron parse", e)
          PY
          fi

          if [ "$fail" != "0" ]; then
            echo "::error::Keeper poke failed — set APP_URL=https://rite-woad.vercel.app and matching CRON_SECRET"
            exit 1
          fi
          echo "OK"
